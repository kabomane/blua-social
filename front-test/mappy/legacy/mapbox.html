<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Globe GPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080d;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    #info {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;

      padding: 12px 16px;
      border-radius: 10px;

      background: rgba(0, 0, 0, 0.55);
      color: white;

      font-size: 14px;
      line-height: 1.5;

      pointer-events: none;
    }

    #status {
      display: inline-block;
      margin-top: 6px;
      color: #9ed7ff;
      font-size: 12px;
    }

  </style>

  <!-- Three.js et ThreeGlobe sont regroupés dans un module local. -->
</head>

<body>

<div id="app"></div>

<div id="info">
  Glisser : rotation<br>
  Molette : zoom<br>
  <span id="status">Chargement de la Terre...</span>
</div>

<script>
  if (window.location.protocol === "file:") {
    const app = document.getElementById("app");
    app.style.display = "grid";
    app.style.placeItems = "center";
    app.style.padding = "24px";
    app.innerHTML = `
      <div style="max-width:560px;padding:24px 28px;border-radius:14px;background:#0b1724;color:#d9edf5;text-align:center;line-height:1.6;box-shadow:0 20px 60px rgba(0,0,0,.35)">
        <strong style="display:block;margin-bottom:8px;font-size:20px">Ouverture sécurisée requise</strong>
        Double-cliquez sur <strong>ouvrir-mapbox.cmd</strong> sur le Bureau.<br>
        Le navigateur bloque les modules et le GPS lorsqu’un fichier HTML est ouvert directement.
      </div>`;
    document.getElementById("info").style.display = "none";
  }
  else {
    import("./mapbox-app.js").catch((error) => {
      console.error("Impossible de démarrer la carte.", error);
      document.getElementById("status").textContent = "Erreur de chargement de la carte";
    });
  }
</script>

</body>
</html>
